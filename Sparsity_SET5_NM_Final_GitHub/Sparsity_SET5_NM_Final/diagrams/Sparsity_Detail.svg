<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: var(--ge-adaptive-bg, #ffffff); color-scheme: light dark;" version="1.1" width="1722px" height="1292px" viewBox="0 0 1722 1292" id="ge-svg-heLNnNcj-P1kjEfJenjz"><style type="text/css">@supports (color: light-dark(#000, #fff)) { #ge-svg-heLNnNcj-P1kjEfJenjz { --ge-adaptive-bg: light-dark(#ffffff, var(--ge-dark-color, #121212)); --ge-adaptive-fg: light-dark(#000000, var(--ge-light-color, #ffffff)); } }</style><defs /><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: var(--ge-adaptive-bg, #ffffff);" /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="t"><g><rect x="1" y="1" width="1720" height="70" fill="#ffffff" stroke="#ffffff" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /></g><g><g><switch><text x="16.0" y="48.5" fill="#162c40" font-family="Malgun Gothic" font-size="30" font-weight="bold"><tspan x="16.0" y="48.5">RTL 상세  |  실제 레지스터 · 함수 · 선택 경로</tspan></text></switch></g></g></g><g data-cell-id="idx"><g><rect x="1" y="111" width="500" height="190" rx="28.5" ry="28.5" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="16.0" y="168.5" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="16.0" y="168.5">입력 위치 계산</tspan><tspan x="16.0" y="190.54">in_k = in_first ? 0 : next_k[in_bank]</tspan><tspan x="16.0" y="212.57999999999998">in_pos = in_k[1:0]</tspan><tspan x="16.0" y="234.62">수락 시 next_k 갱신 / in_last에서 0</tspan><tspan x="16.0" y="256.65999999999997">K=0의 입력들로 마지막 bank 파악</tspan></text></switch></g></g></g><g data-cell-id="an"><g><rect x="1" y="371" width="500" height="165" rx="24.75" ry="24.75" fill="#eaf2ff" stroke="#3976c5" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(234, 242, 255), rgb(23, 30, 41)); stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /></g><g><g><switch><text x="16.0" y="428.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="16.0" y="428.0">A nonzero 위치 생성</tspan><tspan x="16.0" y="450.04">new_a_positions[4*r+q]</tspan><tspan x="16.0" y="472.08">현재 q: in_rows[r] &amp; (in_a[8*r+:8] != 0)</tspan><tspan x="16.0" y="494.12">in_pos=0에서 이전 bitmap 초기화</tspan></text></switch></g></g></g><g data-cell-id="bn"><g><rect x="1" y="611" width="500" height="190" rx="28.5" ry="28.5" fill="#e8f6ee" stroke="#2b8a57" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(232, 246, 238), rgb(20, 32, 26)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g><switch><text x="16.0" y="668.5" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="16.0" y="668.5">B 분류 · 위치 생성</tspan><tspan x="16.0" y="690.54">classify_b(in_b[8*c+:8]) → input_tags</tspan><tspan x="16.0" y="712.58">new_b_positions[4*c+q]</tspan><tspan x="16.0" y="734.62">유효 열이며 tag != ZERO이면 nonzero</tspan><tspan x="16.0" y="756.66">store_b = bank0 또는 K=1</tspan></text></switch></g></g></g><g data-cell-id="store"><g><rect x="611" y="331" width="500" height="470" rx="70.5" ry="70.5" fill="#f5f7fa" stroke="#a0aab6" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /></g><g><g><switch><text x="626.0" y="426.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="626.0" y="426.0">더블 버퍼 레지스터</tspan><tspan x="626.0" y="448.04" /><tspan x="626.0" y="470.08">a_values[2][4 banks][4 K] : 각 32bit</tspan><tspan x="626.0" y="492.12">b_values[2][4 K] : 각 32bit</tspan><tspan x="626.0" y="514.16">b_tags[2][4 K] : 각 16bit</tspan><tspan x="626.0" y="536.2">a_positions[2][4 banks] : 각 16bit</tspan><tspan x="626.0" y="558.24">b_positions[2] : 각 16bit</tspan><tspan x="626.0" y="580.28" /><tspan x="626.0" y="602.3199999999999">rows / cols / first_bank / last_bank</tspan><tspan x="626.0" y="624.36">base_k / group_len / first_group / last_group</tspan><tspan x="626.0" y="646.4" /><tspan x="626.0" y="668.4399999999999">full[1:0] · write_slot · read_slot</tspan><tspan x="626.0" y="690.48">A 원본 값 128B + B 원본 값 32B</tspan><tspan x="626.0" y="712.52">(tag / bitmap / 제어 저장공간은 별도)</tspan></text></switch></g></g></g><g data-cell-id="seal"><g><rect x="611" y="111" width="500" height="150" rx="22.5" ry="22.5" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="626.0" y="160.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="626.0" y="160.0">그룹 완성 조건 seal</tspan><tspan x="626.0" y="182.04">(K 위치=3 또는 in_last)</tspan><tspan x="626.0" y="204.07999999999998">AND (K=1 또는 마지막 bank 도착)</tspan><tspan x="626.0" y="226.12">완성 시 full 설정 → write_slot 전환</tspan></text></switch></g></g></g><g data-cell-id="aout"><g><rect x="1221" y="111" width="500" height="200" rx="30" ry="30" fill="#eaf2ff" stroke="#3976c5" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(234, 242, 255), rgb(23, 30, 41)); stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /></g><g><g><switch><text x="1236.0" y="162.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="1236.0" y="162.0">A128 출력 — 첨부 코드의 조건</tspan><tspan x="1236.0" y="184.04" /><tspan x="1236.0" y="206.07999999999998">out_a[8*(4*q+r)+:8]</tspan><tspan x="1236.0" y="228.12">= a_positions[4*r+q] ? 저장된 A : 0</tspan><tspan x="1236.0" y="250.16">K별 원래 위치로 연결 / A를 열별 재배열 안 함</tspan><tspan x="1236.0" y="272.2">A=0 또는 무효 위치는 0 출력</tspan></text></switch></g></g></g><g data-cell-id="mode"><g><rect x="1221" y="371" width="500" height="190" rx="28.5" ry="28.5" fill="#e8f6ee" stroke="#2b8a57" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(232, 246, 238), rgb(20, 32, 26)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g><switch><text x="1236.0" y="417.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="1236.0" y="417.0">열 c의 모드와 K 결정</tspan><tspan x="1236.0" y="439.04">positions = b_positions[4*c+:4]</tspan><tspan x="1236.0" y="461.08">mode = choose_mode(positions)</tspan><tspan x="1236.0" y="483.12">sparse: select_k(positions, read_round)</tspan><tspan x="1236.0" y="505.15999999999997">dense: k_pos = read_round</tspan><tspan x="1236.0" y="527.2">열의 lane_live 여부도 함께 결정</tspan></text></switch></g></g></g><g data-cell-id="bout"><g><rect x="1221" y="631" width="500" height="170" rx="25.5" ry="25.5" fill="#e8f6ee" stroke="#2b8a57" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(232, 246, 238), rgb(20, 32, 26)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g><switch><text x="1236.0" y="678.5" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="1236.0" y="678.5">B / K / tag 출력</tspan><tspan x="1236.0" y="700.54">out_b[8*c+:8] = B[k_pos,c]</tspan><tspan x="1236.0" y="722.58">out_b_tag[4*c+:4] = tag[k_pos,c]</tspan><tspan x="1236.0" y="744.62">out_k_mask[2*c+:2] = k_pos</tspan><tspan x="1236.0" y="766.66">비활성: B=0 / tag=0 / K index=0</tspan></text></switch></g></g></g><g data-cell-id="wm"><g><rect x="1221" y="871" width="500" height="160" rx="24" ry="24" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="1236.0" y="925.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="1236.0" y="925.0">PE 마스크 출력</tspan><tspan x="1236.0" y="947.04">work_mask[4*r+c]</tspan><tspan x="1236.0" y="969.08">= lane_live &amp; positions[k_pos]</tspan><tspan x="1236.0" y="991.12">  &amp; a_positions[4*r+k_pos]</tspan></text></switch></g></g></g><g data-cell-id="round"><g><rect x="611" y="871" width="500" height="160" rx="24" ry="24" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="626.0" y="925.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="626.0" y="925.0">round 계산 · 읽기 순서</tspan><tspan x="626.0" y="947.04">needed_rounds[c] = dense ? 길이 : mode</tspan><tspan x="626.0" y="969.08">round_count = max(needed_rounds[0..3])</tspan><tspan x="626.0" y="991.12">read_bank 먼저 순회 → read_round 증가</tspan></text></switch></g></g></g><g data-cell-id="tag"><g><rect x="1" y="871" width="500" height="160" rx="24" ry="24" fill="#e8f6ee" stroke="#2b8a57" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(232, 246, 238), rgb(20, 32, 26)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g><switch><text x="16.0" y="926.5" fill="#162c40" font-family="Malgun Gothic" font-size="18" font-weight="normal"><tspan x="16.0" y="926.5">B 태그 규약 (열마다 4bit)</tspan><tspan x="16.0" y="947.38">0 → ZERO(0), +1 → PASS(2), −1 → NEG(3)</tspan><tspan x="16.0" y="968.26">+2,+4,+8,+16,+32,+64 → SHL(9..E)</tspan><tspan x="16.0" y="989.14">나머지 signed INT8 → MUL(1)</tspan></text></switch></g></g></g><g data-cell-id="hand"><g><rect x="1" y="1111" width="1720" height="180" rx="27" ry="27" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="16.0" y="1152.0" fill="#162c40" font-family="Malgun Gothic" font-size="19" font-weight="normal"><tspan x="16.0" y="1152.0">발행 제어 / 경계 / 관찰 출력</tspan><tspan x="16.0" y="1174.04" /><tspan x="16.0" y="1196.08">in_ready = !rst &amp; !full[write_slot]   |   out_valid = !rst &amp; full[read_slot] &amp; !skip_group</tspan><tspan x="16.0" y="1218.12">skip_group: round_count=0인 중간 그룹만 생략 (B의 모드로 결정 — A만 0인 그룹을 뜻하지 않음)</tspan><tspan x="16.0" y="1240.16">out_first: 첫 그룹의 첫 round  /  out_last: 마지막 그룹의 마지막 round</tspan><tspan x="16.0" y="1262.2">out_group_mode_a는 관찰 통계만 출력 · out_group_end는 생략 그룹에서도 bank별 처리 완료를 표시 · clk/rst는 전체 제어에 공통</tspan></text></switch></g></g></g><g data-cell-id="edge1"><g><path d="M 501 206 L 556 206 L 556 186 L 600.76 186" fill="none" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /><path d="M 608.76 186 L 600.76 190 L 600.76 182 Z" fill="#8060b0" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(128, 96, 176), rgb(161, 133, 202)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g></g><g data-cell-id="edge2"><g><path d="M 861 261 L 861 320.76" fill="none" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /><path d="M 861 328.76 L 857 320.76 L 865 320.76 Z" fill="#8060b0" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(128, 96, 176), rgb(161, 133, 202)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g></g><g data-cell-id="edge3"><g><path d="M 501 453.5 L 556 453.5 L 556 566 L 600.76 566" fill="none" stroke="#3976c5" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /><path d="M 608.76 566 L 600.76 570 L 600.76 562 Z" fill="#3976c5" stroke="#3976c5" stroke-width="2" stroke-miterlimit="10" pointer-events="all" styl