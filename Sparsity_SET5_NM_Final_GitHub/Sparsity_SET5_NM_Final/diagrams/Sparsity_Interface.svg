<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: var(--ge-adaptive-bg, #ffffff); color-scheme: light dark;" version="1.1" width="1722px" height="1327px" viewBox="0 0 1722 1327" id="ge-svg-VnAL6uubUu2xDM74p1yQ"><style type="text/css">@supports (color: light-dark(#000, #fff)) { #ge-svg-VnAL6uubUu2xDM74p1yQ { --ge-adaptive-bg: light-dark(#ffffff, var(--ge-dark-color, #121212)); } }</style><defs /><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: var(--ge-adaptive-bg, #ffffff);" /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="t"><g><rect x="1" y="1" width="1720" height="70" fill="#ffffff" stroke="#ffffff" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /></g><g><g><switch><text x="16.0" y="48.5" fill="#162c40" font-family="Malgun Gothic" font-size="30" font-weight="bold"><tspan x="16.0" y="48.5">인터페이스  |  4×4 PE · ACC 4세트 기준</tspan></text></switch></g></g></g><g data-cell-id="in"><g><rect x="1" y="111" width="530" height="350" rx="52.5" ry="52.5" fill="#f5f7fa" stroke="#a0aab6" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /></g><g><g><switch><text x="16.0" y="174.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="16.0" y="174.5">입력: 로더 → 스파시티</tspan><tspan x="16.0" y="197.7" /><tspan x="16.0" y="220.9">in_a 32bit / in_b 32bit</tspan><tspan x="16.0" y="244.1">in_rows 4bit / in_cols 4bit</tspan><tspan x="16.0" y="267.3">in_bank 2bit / in_first 1bit / in_last 1bit</tspan><tspan x="16.0" y="290.5">in_valid 입력 / in_ready 출력</tspan><tspan x="16.0" y="313.7">clk / rst 각 1bit</tspan><tspan x="16.0" y="336.9" /><tspan x="16.0" y="360.1">매번 같은 K의 A 4개 + B 4개</tspan><tspan x="16.0" y="383.29999999999995">in_rows/in_cols는 유효 위치이며</tspan><tspan x="16.0" y="406.5">nonzero 마스크는 내부에서 별도 생성</tspan></text></switch></g></g></g><g data-cell-id="out"><g><rect x="591" y="111" width="530" height="350" rx="52.5" ry="52.5" fill="#fff0de" stroke="#bd7b20" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 240, 222), rgb(41, 28, 13)); stroke: light-dark(rgb(189, 123, 32), rgb(175, 119, 40));" /></g><g><g><switch><text x="606.0" y="186.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="606.0" y="186.5">연산 출력: 스파시티 → MAC</tspan><tspan x="606.0" y="209.7" /><tspan x="606.0" y="232.9">out_a 128bit → op_a</tspan><tspan x="606.0" y="256.1">out_b 32bit → op_b</tspan><tspan x="606.0" y="279.3">out_b_tag 16bit → op_b_tag</tspan><tspan x="606.0" y="302.5">out_k_mask 8bit → column_k_position</tspan><tspan x="606.0" y="325.7">work_mask 16bit → work_mask</tspan><tspan x="606.0" y="348.9">out_rows/out_cols 각 4bit</tspan><tspan x="606.0" y="372.1">out_first/out_last 각 1bit</tspan><tspan x="606.0" y="395.29999999999995">out_valid 출력 / out_ready 입력</tspan></text></switch></g></g></g><g data-cell-id="obs"><g><rect x="1181" y="111" width="530" height="350" rx="52.5" ry="52.5" fill="#f5f7fa" stroke="#a0aab6" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /></g><g><g><switch><text x="1196.0" y="174.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="1196.0" y="174.5">관찰 / 제어 정보 출력</tspan><tspan x="1196.0" y="197.7" /><tspan x="1196.0" y="220.9">out_k 16bit: 그룹 시작 K</tspan><tspan x="1196.0" y="244.1">out_bank 2bit: 타일 bank</tspan><tspan x="1196.0" y="267.3">out_group_len 3bit: 유효 K 개수</tspan><tspan x="1196.0" y="290.5">out_group_end 1bit: bank별 그룹 완료</tspan><tspan x="1196.0" y="313.7">out_group_mask_a / b 각 16bit</tspan><tspan x="1196.0" y="336.9">out_group_mode_a / b 각 8bit</tspan><tspan x="1196.0" y="360.1" /><tspan x="1196.0" y="383.29999999999995">out_bank는 MAC의 bank 선택 입력이 아님</tspan><tspan x="1196.0" y="406.5">MAC은 수락 순서와 first/last로 ACC 선택</tspan><tspan x="1196.0" y="429.7">나머지 신호도 통합/관찰에 사용</tspan></text></switch></g></g></g><g data-cell-id="layout"><g><rect x="1" y="521" width="820" height="270" rx="40.5" ry="40.5" fill="#eaf2ff" stroke="#3976c5" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(234, 242, 255), rgb(23, 30, 41)); stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /></g><g><g><switch><text x="16.0" y="576.5" fill="#162c40" font-family="Malgun Gothic" font-size="21" font-weight="normal"><tspan x="16.0" y="576.5">A 128bit 배치 — K-major</tspan><tspan x="16.0" y="600.86" /><tspan x="16.0" y="625.22">[31:0]    = K0의 A 행0 / 행1 / 행2 / 행3</tspan><tspan x="16.0" y="649.58">[63:32]   = K1의 A 행0 / 행1 / 행2 / 행3</tspan><tspan x="16.0" y="673.94">[95:64]   = K2의 A 행0 / 행1 / 행2 / 행3</tspan><tspan x="16.0" y="698.3">[127:96]  = K3의 A 행0 / 행1 / 행2 / 행3</tspan><tspan x="16.0" y="722.66" /><tspan x="16.0" y="747.02">정확한 byte: out_a[8*(4*k+r)+:8] = A[r,k]</tspan></text></switch></g></g></g><g data-cell-id="bits"><g><rect x="881" y="521" width="830" height="270" rx="40.5" ry="40.5" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="896.0" y="580.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="896.0" y="580.5">서로 다른 마스크 / 인덱스의 배치</tspan><tspan x="896.0" y="603.7" /><tspan x="896.0" y="626.9">out_k_mask[2*c+:2] : 열 c의 K 인덱스 (0~3)</tspan><tspan x="896.0" y="650.1">  열0=[1:0] · 열1=[3:2] · 열2=[5:4] · 열3=[7:6]</tspan><tspan x="896.0" y="673.3">work_mask[4*r+c] : 이번 round의 PE[r,c] 허용</tspan><tspan x="896.0" y="696.5">out_group_mask_a[4*r+k] : A 행 r의 원래 K 위치</tspan><tspan x="896.0" y="719.7">out_group_mask_b[4*c+k] : B 열 c의 원래 K 위치</tspan><tspan x="896.0" y="742.9">각 group_mode[2*i+:2] : 00 / 01 / 10 / 11</tspan></text></switch></g></g></g><g data-cell-id="example"><g><rect x="1" y="861" width="820" height="350" rx="52.5" ry="52.5" fill="#eaf2ff" stroke="#3976c5" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(234, 242, 255), rgb(23, 30, 41)); stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /></g><g><g><switch><text x="16.0" y="919.0" fill="#162c40" font-family="Malgun Gothic" font-size="21" font-weight="normal"><tspan x="16.0" y="919.0">서로 다른 K를 한 round에 연산하는 예</tspan><tspan x="16.0" y="943.36" /><tspan x="16.0" y="967.72">             K0   K1   K2   K3</tspan><tspan x="16.0" y="992.08">A 행0        2    3    4    5</tspan><tspan x="16.0" y="1016.44">B 열0        0    7    0    2    → 2:4</tspan><tspan x="16.0" y="1040.8">B 열1        6    0    8    0    → 2:4</tspan><tspan x="16.0" y="1065.16" /><tspan x="16.0" y="1089.52">round0: 열0 K1 → 3×7 / 열1 K0 → 2×6</tspan><tspan x="16.0" y="1113.88">round1: 열0 K3 → 5×2 / 열1 K2 → 4×8</tspan><tspan x="16.0" y="1138.24">누산 결과: C[0,0]=31 / C[0,1]=44</tspan><tspan x="16.0" y="1162.6">A는 두 round 모두 원래 K 순서로 전달</tspan></text></switch></g></g></g><g data-cell-id="modes"><g><rect x="881" y="861" width="830" height="350" rx="52.5" ry="52.5" fill="#e8f6ee" stroke="#2b8a57" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(232, 246, 238), rgb(20, 32, 26)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g><switch><text x="896.0" y="919.0" fill="#162c40" font-family="Malgun Gothic" font-size="21" font-weight="normal"><tspan x="896.0" y="919.0">모드별 동작과 주의할 해석</tspan><tspan x="896.0" y="943.36" /><tspan x="896.0" y="967.72">00: nonzero 0개 → 해당 열 비활성</tspan><tspan x="896.0" y="992.08">01: nonzero 1개 → 그 K를 1 round에 발행</tspan><tspan x="896.0" y="1016.44">10: nonzero 2개 → 그 K들을 2 round에 발행</tspan><tspan x="896.0" y="1040.8">11: nonzero 3~4개 → 원래 K 순서로 dense 발행</tspan><tspan x="896.0" y="1065.16" /><tspan x="896.0" y="1089.52">그룹의 round 수는 가장 긴 열에 맞춤</tspan><tspan x="896.0" y="1113.88">먼저 끝난 열: B/tag/work_mask를 0으로 전달</tspan><tspan x="896.0" y="1138.24">0인 첫/마지막 그룹은 제어 패킷 유지</tspan><tspan x="896.0" y="1162.6">프루닝 없음: nonzero 값을 버리지 않음</tspan></text></switch></g></g></g><g data-cell-id="footer"><g><rect x="1" y="1261" width="1710" height="65" fill="#ffffff" stroke="#ffffff" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /></g><g><g><switch><text x="16.0" y="1301.5" fill="#162c40" font-family="Malgun Gothic" font-size="17" font-weight="bold"><tspan x="16.0" y="1301.5">기준 RTL SHA-256: dbdb0d679d18671a129ace19…  |  첨부 코드의 실제 연결을 표현 · RTL 수정 없음 · NM_ENABLE 없음</tspan></text></switch></g></g></g></g></g></g></svg>