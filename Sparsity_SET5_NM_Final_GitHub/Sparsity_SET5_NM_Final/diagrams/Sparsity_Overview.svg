ct fill="#ffffff" stroke="none" x="1702" y="585" width="39" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /><text x="1721" y="601">A128</text></g></g></g><g data-cell-id="edge8"><g><path d="M 1361 691 L 1271 691 L 1271 825.76" fill="none" stroke="#2b8a57" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /><path d="M 1271 833.76 L 1267 825.76 L 1275 825.76 Z" fill="#2b8a57" stroke="#2b8a57" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(43, 138, 87), rgb(77, 159, 115)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g fill="#000000" font-family="'Malgun Gothic'" text-anchor="middle" font-size="16px" style="fill: var(--ge-adaptive-fg, #000000);"><rect fill="#ffffff" stroke="none" x="1247" y="710" width="49" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /><text x="1271" y="726">선택 K</text></g></g></g><g data-cell-id="edge9"><g><path d="M 891 413 L 881 413 L 881 854 L 880.76 854" fill="none" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /><path d="M 888.76 854 L 880.76 858 L 880.76 850 Z" fill="#8060b0" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(128, 96, 176), rgb(161, 133, 202)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g fill="#000000" font-family="'Malgun Gothic'" text-anchor="middle" font-size="16px" style="fill: var(--ge-adaptive-fg, #000000);"><rect fill="#ffffff" stroke="none" x="839" y="625" width="85" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /><text x="881" y="641">A/B bitmap</text></g></g></g><g data-cell-id="edge10"><g><path d="M 1271 926 L 1316 926 L 1316 948.5 L 1350.76 948.5" fill="none" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /><path d="M 1358.76 948.5 L 1350.76 952.5 L 1350.76 944.5 Z" fill="#8060b0" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(128, 96, 176), rgb(161, 133, 202)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g fill="#000000" font-family="'Malgun Gothic'" text-anchor="middle" font-size="16px" style="fill: var(--ge-adaptive-fg, #000000);"><rect fill="#ffffff" stroke="none" x="1267" y="928" width="99" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /><text x="1316" y="944">work_mask16</text></g></g></g></g></g></g></svg>