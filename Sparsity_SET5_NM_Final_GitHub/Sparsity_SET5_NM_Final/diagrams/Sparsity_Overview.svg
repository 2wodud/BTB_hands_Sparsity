<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: var(--ge-adaptive-bg, #ffffff); color-scheme: light dark;" version="1.1" width="1740px" height="1137px" viewBox="0 0 1740 1137" id="ge-svg-GASYm1PK34XBL_KYLx4U"><style type="text/css">@supports (color: light-dark(#000, #fff)) { #ge-svg-GASYm1PK34XBL_KYLx4U { --ge-adaptive-bg: light-dark(#ffffff, var(--ge-dark-color, #121212)); --ge-adaptive-fg: light-dark(#000000, var(--ge-light-color, #ffffff)); } }</style><defs /><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: var(--ge-adaptive-bg, #ffffff);" /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="t"><g><rect x="1" y="1" width="1720" height="75" fill="#ffffff" stroke="#ffffff" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /></g><g><g><switch><text x="16.0" y="51.5" fill="#162c40" font-family="Malgun Gothic" font-size="30" font-weight="bold"><tspan x="16.0" y="51.5">SPARSITY FRONTEND  |  입력을 모으고, B의 K를 압축해서 MAC에 전달</tspan></text></switch></g></g></g><g data-cell-id="sub"><g><rect x="1" y="76" width="1720" height="65" fill="#ffffff" stroke="#ffffff" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /></g><g><g><switch><text x="16.0" y="117.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="bold"><tspan x="16.0" y="117.5">기준: 사용자가 붙여준 RTL 그대로 · PE_ROWS=4 / PE_COLS=4 / NBANK=4 · NM_ENABLE 없음</tspan></text></switch></g></g></g><g data-cell-id="loader"><g><rect x="1" y="201" width="310" height="220" rx="33" ry="33" fill="#f5f7fa" stroke="#a0aab6" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /></g><g><g><switch><text x="16.0" y="271.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="16.0" y="271.5">메모리팀 LOADER</tspan><tspan x="16.0" y="294.7" /><tspan x="16.0" y="317.9">in_a[31:0] : 같은 K의 A 4개</tspan><tspan x="16.0" y="341.1">in_b[31:0] : 같은 K의 B 4개</tspan><tspan x="16.0" y="364.3">유효 행/열 + bank + first/last</tspan></text></switch></g></g></g><g data-cell-id="det"><g><rect x="411" y="201" width="380" height="220" rx="33" ry="33" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="426.0" y="259.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="426.0" y="259.5">① 입력 수락 · 값 판별</tspan><tspan x="426.0" y="282.7" /><tspan x="426.0" y="305.9">accept_input = in_valid &amp; in_ready</tspan><tspan x="426.0" y="329.1">A: 행마다 nonzero 판별</tspan><tspan x="426.0" y="352.3">B: 열마다 nonzero + 특수값 tag</tspan><tspan x="426.0" y="375.5">입력 순서: K → bank</tspan></text></switch></g></g></g><g data-cell-id="buf"><g><rect x="891" y="181" width="380" height="290" rx="43.5" ry="43.5" fill="#f5f7fa" stroke="#a0aab6" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /></g><g><g><switch><text x="906.0" y="238.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="906.0" y="238.5">② 그룹 버퍼 × 2</tspan><tspan x="906.0" y="261.7" /><tspan x="906.0" y="284.9">A: bank별 K 네 위치 저장</tspan><tspan x="906.0" y="308.1">  a_values[slot][bank][K]</tspan><tspan x="906.0" y="331.3">B: bank들이 공유하는 값 저장</tspan><tspan x="906.0" y="354.5">  b_values[slot][K]</tspan><tspan x="906.0" y="377.7">nonzero bitmap · B tag · 경계 저장</tspan><tspan x="906.0" y="400.9" /><tspan x="906.0" y="424.1">한쪽 수집 ↔ 다른 쪽 출력</tspan></text></switch></g></g></g><g data-cell-id="apack"><g><rect x="1361" y="181" width="350" height="160" rx="24" ry="24" fill="#eaf2ff" stroke="#3976c5" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(234, 242, 255), rgb(23, 30, 41)); stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /></g><g><g><switch><text x="1376.0" y="221.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="1376.0" y="221.5">③ A 전체 묶기</tspan><tspan x="1376.0" y="244.7" /><tspan x="1376.0" y="267.9">K0/K1/K2/K3의 A 벡터</tspan><tspan x="1376.0" y="291.1">원래 K 순서 · 128비트</tspan><tspan x="1376.0" y="314.3">열별 A 선택은 MAC이 수행</tspan></text></switch></g></g></g><g data-cell-id="bmode"><g><rect x="891" y="561" width="380" height="175" rx="26.25" ry="26.25" fill="#e8f6ee" stroke="#2b8a57" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(232, 246, 238), rgb(20, 32, 26)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g><switch><text x="906.0" y="609.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="906.0" y="609.5">③ B 열별 모드 결정</tspan><tspan x="906.0" y="632.7" /><tspan x="906.0" y="655.9">choose_mode(): 0 / 1 / 2 / dense</tspan><tspan x="906.0" y="679.1">round 수 = 네 열 요구량의 최댓값</tspan><tspan x="906.0" y="702.3">A 모드 통계는 round를 줄이지 않음</tspan></text></switch></g></g></g><g data-cell-id="bselect"><g><rect x="1361" y="511" width="350" height="225" rx="33.75" ry="33.75" fill="#e8f6ee" stroke="#2b8a57" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(232, 246, 238), rgb(20, 32, 26)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g><switch><text x="1376.0" y="560.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="1376.0" y="560.5">④ 열마다 B의 K 선택</tspan><tspan x="1376.0" y="583.7" /><tspan x="1376.0" y="606.9">0:4 → 비활성</tspan><tspan x="1376.0" y="630.1">1:4 / 2:4 → nonzero K 순서</tspan><tspan x="1376.0" y="653.3">dense → 원래 K 순서</tspan><tspan x="1376.0" y="676.5" /><tspan x="1376.0" y="699.7">B32 + tag16 + K index8</tspan></text></switch></g></g></g><g data-cell-id="mask"><g><rect x="891" y="836" width="380" height="180" rx="27" ry="27" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="906.0" y="886.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="906.0" y="886.5">⑤ PE별 work_mask[15:0]</tspan><tspan x="906.0" y="909.7" /><tspan x="906.0" y="932.9">선택된 K에서</tspan><tspan x="906.0" y="956.1">A nonzero AND B nonzero</tspan><tspan x="906.0" y="979.3">비활성 열은 tag=0, mask=0</tspan></text></switch></g></g></g><g data-cell-id="mac"><g><rect x="1361" y="836" width="350" height="225" rx="33.75" ry="33.75" fill="#fff0de" stroke="#bd7b20" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 240, 222), rgb(41, 28, 13)); stroke: light-dark(rgb(189, 123, 32), rgb(175, 119, 40));" /></g><g><g><switch><text x="1376.0" y="885.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="1376.0" y="885.5">MAC팀 NM MAC</tspan><tspan x="1376.0" y="908.7" /><tspan x="1376.0" y="931.9">A128 중 K index로 A 선택</tspan><tspan x="1376.0" y="955.1">B tag로 MUL / PASS / NEG / SHL</tspan><tspan x="1376.0" y="978.3">work_mask=1인 PE만 누산</tspan><tspan x="1376.0" y="1001.5" /><tspan x="1376.0" y="1024.7">실제 곱셈·누산은 여기서 수행</tspan></text></switch></g></g></g><g data-cell-id="ctrl"><g><rect x="1" y="561" width="790" height="175" rx="26.25" ry="26.25" fill="#f0eaff" stroke="#8060b0" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(240, 234, 255), rgb(36, 31, 49)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g><g><g><switch><text x="16.0" y="609.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="16.0" y="609.5">출력 순서 / handshake</tspan><tspan x="16.0" y="632.7" /><tspan x="16.0" y="655.9">round0: bank0 → bank1 → bank2 → bank3, 다음 round도 같은 순서</tspan><tspan x="16.0" y="679.1">out_valid &amp; out_ready에서만 출력 진행 · ready=0이면 패킷 고정</tspan><tspan x="16.0" y="702.3">bank별 단독 패킷 생략 금지: A=0이면 mask=0으로 전달</tspan><tspan x="16.0" y="725.5">빈 그룹 버퍼가 없으면 in_ready=0 → 로더 대기</tspan></text></switch></g></g></g><g data-cell-id="zero"><g><rect x="1" y="836" width="790" height="180" rx="27" ry="27" fill="#f5f7fa" stroke="#a0aab6" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(245, 247, 250), rgb(24, 25, 28)); stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /></g><g><g><switch><text x="16.0" y="886.5" fill="#162c40" font-family="Malgun Gothic" font-size="20" font-weight="normal"><tspan x="16.0" y="886.5">경계 처리</tspan><tspan x="16.0" y="909.7" /><tspan x="16.0" y="932.9">B 전체가 0인 중간 그룹: MAC 발행 생략</tspan><tspan x="16.0" y="956.1">첫/마지막 0 그룹: ACC 초기화/출력용 mask=0 패킷 유지</tspan><tspan x="16.0" y="979.3">마지막 K가 1~3개이면 실제 길이만 처리 · K=1은 개별 완결</tspan></text></switch></g></g></g><g data-cell-id="foot"><g><rect x="1" y="1071" width="1710" height="65" fill="#ffffff" stroke="#ffffff" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /></g><g><g><switch><text x="16.0" y="1111.5" fill="#162c40" font-family="Malgun Gothic" font-size="18" font-weight="bold"><tspan x="16.0" y="1111.5">파랑=A 경로  ·  초록=B 경로  ·  보라=마스크/제어  ·  주황=MAC 경계 밖  |  입력의 A 4개씩을 모아 출력의 A 16개로 연결</tspan></text></switch></g></g></g><g data-cell-id="edge1"><g><path d="M 311 311 L 400.76 311" fill="none" stroke="#a0aab6" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /><path d="M 408.76 311 L 400.76 315 L 400.76 307 Z" fill="#a0aab6" stroke="#a0aab6" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(160, 170, 182), rgb(84, 93, 103)); stroke: light-dark(rgb(160, 170, 182), rgb(84, 93, 103));" /></g></g><g data-cell-id="edge2"><g><path d="M 791 311 L 841 311 L 841 326 L 880.76 326" fill="none" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /><path d="M 888.76 326 L 880.76 330 L 880.76 322 Z" fill="#8060b0" stroke="#8060b0" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(128, 96, 176), rgb(161, 133, 202)); stroke: light-dark(rgb(128, 96, 176), rgb(161, 133, 202));" /></g></g><g data-cell-id="edge3"><g><path d="M 1271 326 L 1316 326 L 1316 261 L 1350.76 261" fill="none" stroke="#3976c5" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /><path d="M 1358.76 261 L 1350.76 265 L 1350.76 257 Z" fill="#3976c5" stroke="#3976c5" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(57, 118, 197), rgb(96, 148, 216)); stroke: light-dark(rgb(57, 118, 197), rgb(96, 148, 216));" /></g></g><g data-cell-id="edge4"><g><path d="M 1081 471 L 1081 550.76" fill="none" stroke="#2b8a57" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /><path d="M 1081 558.76 L 1077 550.76 L 1085 550.76 Z" fill="#2b8a57" stroke="#2b8a57" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(43, 138, 87), rgb(77, 159, 115)); stroke: light-dark(rgb(43, 138, 87), rgb(77, 159, 115));" /></g><g><g fill="#000000" font-family="'Malgun Gothic'" text-anchor="middle" font-size="16px" style="fill: var(--ge-adaptive-fg, #000000);"><rect fill="#ffffff" stroke="none" x="1029" y="507" width="106" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));" /><text x="1081" y="523">B 위치 bitmap</text></g></g></g><g data-cell-id="edge5"><g><path 